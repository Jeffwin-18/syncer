name: Release

on:
  push:
    tags:
      - "[0-9]*" # Triggers on version tags like 0.1.0 and 0.5.0-beta.1

jobs:
  release-beta:
    name: Create Beta Prerelease
    if: contains(github.ref_name, '-beta.')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    # Beta tags use build:staging and publish a GitHub prerelease without the prod gate.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for tags
          fetch-tags: true

      - name: Fetch annotated tag object
        run: git fetch origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" --force

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Lint code (ESLint)
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Verify committed OAuth client IDs
        run: npm run check:oauth-clients

      - name: Build plugin (staging)
        run: npm run build:staging

      - name: Verify release readiness
        run: npm run release:check

      - name: Extract version from tag
        id: get_version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=$TAG_NAME
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building beta release for version: $VERSION (tag: $TAG_NAME)"

      - name: Verify tag matches manifest version
        run: |
          TAG_NAME=${{ steps.get_version.outputs.tag }}
          MANIFEST_VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('manifest.json', 'utf8')).version")
          if [ "$TAG_NAME" != "$MANIFEST_VERSION" ]; then
            echo "Tag ($TAG_NAME) does not match manifest version ($MANIFEST_VERSION)."
            exit 1
          fi

      - name: Generate release asset attestations
        id: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            main.js
            manifest.json
            styles.css
          name: ${{ steps.get_version.outputs.version }}
          tag_name: ${{ steps.get_version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: true

  release-stable:
    name: Create Stable Release
    if: ${{ !contains(github.ref_name, '-beta.') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    environment: prod
    # Prod OAuth client IDs come from committed oauth-clients.prod.json so Observer
    # rebuilds match the published main.js. Do not inject *_PROD secrets — that
    # would diverge from a clean-checkout build.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for tags
          fetch-tags: true

      - name: Fetch annotated tag object
        run: git fetch origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" --force

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Lint code (ESLint)
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Verify committed OAuth client IDs
        run: npm run check:oauth-clients

      - name: Build plugin (prod, deterministic)
        run: npm run verify:prod-build

      - name: Verify release readiness
        run: npm run release:check

      - name: Extract version from tag
        id: get_version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=$TAG_NAME
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building stable release for version: $VERSION (tag: $TAG_NAME)"

      - name: Verify tag matches manifest version
        run: |
          TAG_NAME=${{ steps.get_version.outputs.tag }}
          MANIFEST_VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('manifest.json', 'utf8')).version")
          if [ "$TAG_NAME" != "$MANIFEST_VERSION" ]; then
            echo "Tag ($TAG_NAME) does not match manifest version ($MANIFEST_VERSION)."
            exit 1
          fi

      - name: Generate release asset attestations
        id: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            main.js
            manifest.json
            styles.css
          name: ${{ steps.get_version.outputs.version }}
          tag_name: ${{ steps.get_version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
